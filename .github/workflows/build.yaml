name: build

on:
  workflow_dispatch:
  push:
env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      staging_tag: ${{ steps.staging.outputs.tag }}
    steps:
      - name: Create staging release
        id: staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            runs_on: ubuntu-latest
          - platform: windows
            os: Windows-2022
            runs_on: Windows-2022
            arch: amd64
          # - platform: linux
          #   os: ubuntu-22.04
          #   runs_on: ubuntu-22.04
          #   arch: amd64
          - platform: macos
            os: macos-26-x64
            runs_on:
              - self-hosted
              - macOS
              - X64
            arch: arm64

          # - platform: windows
          #   os: windows-11-arm
          #   runs_on: windows-11-arm
          #   arch: arm64

          # - platform: linux
          #   os: ubuntu-24.04-arm
          #   runs_on: ubuntu-24.04-arm
          #   arch: arm64

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          # Self-hosted runners reuse local caches; restoring over read-only modules fails.
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: |
            core/mihomo/go.sum

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          # Reuse the local SDK and pub cache on self-hosted runners.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Setup Flutter With Other
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.44.8
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Setup Java
        if: startsWith(matrix.platform, 'android')
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        if: startsWith(matrix.platform, 'android')
        uses: android-actions/setup-android@v4

      - name: Setup Android SDK
        if: startsWith(matrix.platform, 'android')
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Verify
        if: startsWith(matrix.platform, 'android')
        shell: bash
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
          (cd core && CGO_ENABLED=0 go test -tags=with_gvisor ./...)

      - name: Setup Android Signing
        if: startsWith(matrix.platform, 'android')
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          test -s android/app/keystore.jks
          keytool -list \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Reset SwiftPM Cache
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: rm -rf "$HOME/Library/Caches/org.swift.swiftpm"

      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Verify Android Signature
        if: startsWith(matrix.platform, 'android')
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          APK="$(find dist -type f -name '*-android-arm64-v8a.apk' -print -quit)"
          test -n "$APK"
          APPLICATION_ID="$("$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" \
            manifest application-id "$APK")"
          test "$APPLICATION_ID" = "com.follow.clash.dev"
          EXPECTED="$(keytool -list -v \
            -keystore android/app/keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload to staging release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.staging_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: ./dist/**/*
          fail_on_unmatched_files: true

  release:
    permissions:
      contents: write
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release source
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            branch="${GITHUB_REF#refs/heads/}"
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            if [[ "$(git rev-parse "origin/$branch")" == "$GITHUB_SHA" ]]; then
              echo 'eligible=true' >> "$GITHUB_OUTPUT"
              if [[ "$branch" == main ]]; then
                echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
              else
                echo "tag=$branch" >> "$GITHUB_OUTPUT"
              fi
            else
              echo 'eligible=false' >> "$GITHUB_OUTPUT"
              echo "A newer $branch commit exists; skipping stale release."
            fi
            exit 0
          fi

          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Tag commit is not reachable from main; skipping release.'
          fi

      - name: Download from staging release
        if: steps.release.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_TAG: ${{ needs.prepare.outputs.staging_tag }}
        run: gh release download "$STAGING_TAG" --dir ./dist

      - name: Update rolling branch tag
        if: steps.release.outputs.eligible == 'true' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            let exists = true;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }
            if (exists) {
              await github.rest.git.updateRef({ ...context.repo, ref: `tags/${tag}`, sha: context.sha, force: true });
            } else {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }

      - name: Publish release
        if: steps.release.outputs.eligible == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release.outputs.tag }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' || env.IS_STABLE != 'true' && startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ github.ref == 'refs/heads/main' || env.IS_STABLE == 'true' }}
          files: ./dist/**/*
          fail_on_unmatched_files: true

  cleanup:
    if: always() && needs.prepare.result == 'success'
    needs: [ prepare, build, release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete staging release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGING_TAG: ${{ needs.prepare.outputs.staging_tag }}
        run: gh release delete "$STAGING_TAG" --yes --cleanup-tag
